[project]
name = "narrated-video-tools"
version = "0.1.0"
description = "Build narrated demos from episode YAML, screen recordings and slides"
requires-python = ">=3.11"
dependencies = ["jinja2>=3.1", "playwright>=1.50", "pyyaml>=6"]

[project.scripts]
video-tools = "video_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_tools"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]
